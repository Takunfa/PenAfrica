<!DOCTYPE html>
<html>
<head>
    <title>Pen Africa</title>
    <style>
        @font-face {
            font-family: "Moonstone";
            src: url("fonts/moonstone.ttf");
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:radial-gradient(circle at 50% 35%, #10302c, #0a0614 65%, #000);
            color:white;
            font-family:Arial;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            position:relative;
            overflow:hidden;
        }

        /* STARFIELD */
        .stars{
            position:fixed;
            inset:0;
            pointer-events:none;
            z-index:0;
        }
        .star{
            position:absolute;
            width:2px;
            height:2px;
            background:#fff;
            border-radius:50%;
            animation:twinkle 3s infinite ease-in-out;
        }
        .star.big{
            width:3px;
            height:3px;
            box-shadow:0 0 4px 1px rgba(168, 255, 239, 0.8);
        }
        @keyframes twinkle{
            0%,100%{opacity:0.15;}
            50%{opacity:1;}
        }

        /* WATERMARK LOGO — the constellation's anchor.
           Real transparent PNG now, so no blend-mode trickery needed —
           drop-shadow traces the actual feather silhouette for its glow. */
        .logo-anchor{
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            width:min(85vw,620px);
            pointer-events:none;
            z-index:1;
        }
        .logo-anchor img{
            width:100%;
            display:block;
            animation:breatheImg 4.5s infinite ease-in-out;
        }
        @keyframes breatheImg{
            0%,100%{
                opacity:0.72;
                transform:scale(0.98);
                filter:saturate(1.3) brightness(1.05)
                    drop-shadow(0 0 22px rgba(86, 248, 242, 0.5490196078431373))
                    drop-shadow(0 0 45px rgba(57, 238, 223, 0.34901960784313724));
            }
            50%{
                opacity:0.95;
                transform:scale(1.03);
                filter:saturate(1.5) brightness(1.2)
                    drop-shadow(0 0 40px rgba(85, 246, 247, 0.8509803921568627))
                    drop-shadow(0 0 80px rgba(58, 237, 209, 0.5490196078431373));
            }
        }

        /* Orbiting particles drawn TOWARD the nib point (the glowing tip
           near the bottom-center of the feather image, roughly where the
           pen meets the inkwell) */
        .orbit-particle{
            position:fixed;
            width:4px;height:4px;
            background:#c8fff7;
            border-radius:50%;
            box-shadow:
                0 0 10px 3px rgba(200, 255, 252, 0.9019607843137255),
                0 0 20px 6px rgba(86, 241, 247, 0.5019607843137255);
            z-index:2;
            pointer-events:none;
            animation:orbitIn linear infinite;
        }
        @keyframes orbitIn{
            0%{opacity:0;transform:scale(1.4);}
            12%{opacity:1;}
            80%{opacity:0.9;}
            100%{
                opacity:0;
                transform:translate(var(--dx),var(--dy)) scale(0.15);
            }
        }

        /* CONTENT */
        .z{
            position:relative;
            z-index:3;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:40px 24px;
            width:90%;
            max-width:800px;
        }

        .community{
            display:inline-block;
            padding:15px 35px;
            border:1px solid rgba(255,255,255,0.2);
            border-radius:50px;
            color:#b4fefd;
            letter-spacing:3px;
            margin-bottom:50px;
            backdrop-filter:blur(6px);
            background:rgba(10,6,20,0.3);
        }

        h1{
            font-size:70px;
            line-height:1.1;
            font-family:"Moonstone";
            text-align:center;
        }

        .voices{
            color:#5cfbff;
            text-shadow:
                0 0 15px white,
                0 0 30px #3aedcf,
                0 0 50px #3aede4;
        }

        .description{
            margin-top:40px;
            font-size:28px;
            line-height:1.8;
            color:#d0d0d0;
            text-align:center;
        }

        .button-area{
            margin-top:80px;
        }
        .enter-btn{
            width:350px;
            height:90px;
            border:none;
            border-radius:50px;
            background:linear-gradient(90deg,#3ae4ed,#0a3d35);
            color:white;
            font-family:"Moonstone";
            font-size:26px;
            font-weight:bold;
            cursor:pointer;
            box-shadow:0 0 25px rgba(58, 237, 199, 0.5019607843137255);
            transition:.4s;
            animation:pulse 3s infinite;
        }
        @keyframes pulse{
            0%{transform:scale(1);box-shadow:0 0 0 0 rgba(58, 236, 199, 0.7019607843137254);}
            50%{transform:scale(1.04);box-shadow:0 0 40px 20px rgba(124,58,237,0);}
            100%{transform:scale(1);box-shadow:0 0 0 0 rgba(124,58,237,0);}
        }
        .enter-btn.sink{
            animation:sinkIn .9s forwards;
        }
        .enter-btn:hover{
            transform:scale(1.05);
            box-shadow:0 0 50px rgba(58, 237, 221, 0.9019607843137255);
        }

        body.portal-active::after{
            content:"";
            position:fixed;
            inset:0;
            background:radial-gradient(circle,rgba(57, 237, 230, 0.4),rgba(0, 33, 31, 0.9019607843137255),black);
            opacity:0;
            animation:warpIn .9s forwards;
            z-index:20;
        }

        @keyframes sinkIn{
            0%{transform:scale(1);opacity:1;}
            40%{transform:scale(1.15);}
            100%{transform:scale(0);opacity:0;filter:blur(8px);}
        }
        @keyframes warpIn{
            from{opacity:0;}
            to{opacity:1;}
        }

        @media(max-width:700px){
            h1{font-size:48px;}
            .description{font-size:22px;}
            .enter-btn{width:300px;font-size:28px;}
            .logo-anchor{width:min(95vw,460px);}
        }

        @media(max-width:420px){
            h1{font-size:34px;}
            .community{padding:10px 20px;letter-spacing:1.5px;font-size:13px;margin-bottom:30px;}
            .description{font-size:17px;margin-top:26px;}
            .enter-btn{width:260px;font-size:22px;}
        }
    </style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="logo-anchor">
    <img src="logo2.png" alt="">
</div>

<div class="z">
    <p class="community">PEN AFRICA COMMUNITY</p>
    <h1>
        One Continent.<br>
        <span class="voices">A Thousand Voices.</span><br>
        Infinite Verses.
    </h1>
    <p class="description">
        Pen Africa is the digital home for African poets —
        a place to publish your work, connect with writers,
        sharpen your craft, and discover what your words
        are truly capable of.
    </p>
    <div class="button-area">
        <button class="enter-btn" onclick="enterPortal(this)">Enter The Circle</button>
    </div>
</div>

<script>
// Ambient starfield, scattered across the whole viewport
const starsEl = document.getElementById('stars');
for (let i = 0; i < 70; i++) {
    const d = document.createElement('div');
    d.className = 'star' + (Math.random() > 0.85 ? ' big' : '');
    d.style.left = Math.random() * 100 + '%';
    d.style.top = Math.random() * 100 + '%';
    d.style.animationDelay = Math.random() * 3 + 's';
    starsEl.appendChild(d);
}

// Orbiting particles that drift TOWARD the logo's nib point —
// spawned in a ring around the anchor, converging inward, giving the
// impression the constellation is being drawn from the feather itself.
function spawnOrbitParticle() {
    const p = document.createElement('div');
    p.className = 'orbit-particle';

    const angle = Math.random() * Math.PI * 2;
    const radius = 180 + Math.random() * 160;
    const startX = window.innerWidth / 2 + Math.cos(angle) * radius;
    const startY = window.innerHeight / 2 + Math.sin(angle) * radius * 0.7;

    // Nib point sits roughly at the visual center-bottom of the logo image
    const endX = window.innerWidth / 2 - startX;
    const endY = (window.innerHeight / 2 + 40) - startY;

    p.style.left = startX + 'px';
    p.style.top = startY + 'px';
    p.style.setProperty('--dx', endX + 'px');
    p.style.setProperty('--dy', endY + 'px');
    p.style.animationDuration = (2.5 + Math.random() * 2) + 's';

    document.body.appendChild(p);
    setTimeout(() => p.remove(), 5000);
}
setInterval(spawnOrbitParticle, 220);

function enterPortal(btn) {
    document.body.classList.add("portal-active");
    btn.classList.add("sink");
    setTimeout(() => {
        window.location.href = "login.html";
    }, 900);
}
</script>

</body>
</html>

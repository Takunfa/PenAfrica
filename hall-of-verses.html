<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hall of Verses — Pen Africa</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white:   #ffffff;
      --ivory:   #FFF9EC;
      --gold:    #D4A72C;
      --gold-lt: #F0DFA3;
      --ink:     #2B2440;
      --muted:   #8B7BA8;
      --coral:   #E8563D;
      --rule:    rgba(43,36,64,0.10);
      --serif:   'Cormorant Garamond', serif;
      --sans:    'Inter', system-ui, sans-serif;
    }
    body { background: var(--white); color: var(--ink); font-family: var(--sans); min-height: 100vh; }
    a { text-decoration: none; color: inherit; }

    .header {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 0 52px; height: 84px; border-bottom: 1px solid var(--rule);
    }
    .pen-name { font-family: var(--serif); font-style: italic; font-size: 1.05rem; color: var(--ink); }
    .header-brand { text-align: center; font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .header-icons { justify-self: end; display: flex; gap: 22px; font-size: 1.1rem; align-items: center; }
    .header-icons a { opacity: 0.5; transition: opacity .2s, transform .2s; }
    .header-icons a:hover { opacity: 1; transform: scale(1.15); }

    .notif-wrap { position: relative; }
    .notif-bell-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; opacity: 0.5; transition: opacity .2s, transform .2s; position: relative; padding: 0; line-height: 1; color: inherit; font-family: inherit; }
    .notif-bell-btn:hover { opacity: 1; transform: scale(1.15); }
    .notif-badge { position: absolute; top: -6px; right: -8px; background: var(--coral); color: #fff; font-size: 0.6rem; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; font-family: 'Inter', sans-serif; }
    .notif-dropdown { display: none; position: absolute; top: calc(100% + 14px); right: 0; width: 340px; max-width: 90vw; max-height: 480px; background: var(--white); border: 1px solid var(--rule); border-radius: 4px; box-shadow: 0 16px 40px rgba(43,36,64,0.2); overflow: hidden; flex-direction: column; z-index: 200; }
    .notif-dropdown.open { display: flex; }
    .notif-dropdown-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--rule); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--ink); }
    .notif-mark-all { background: none; border: none; color: var(--gold); font-size: 0.72rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .notif-mark-all:hover { text-decoration: underline; }
    .notif-list { overflow-y: auto; flex: 1; }
    .notif-item { display: block; padding: 12px 16px; border-bottom: 1px solid var(--rule); cursor: pointer; transition: background .15s; text-align: left; }
    .notif-item:hover { background: var(--ivory); }
    .notif-item.unread { background: rgba(212,167,44,0.07); }
    .notif-item.unread::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-right: 6px; vertical-align: middle; }
    .notif-title { font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
    .notif-body { font-family: 'Inter', sans-serif; font-size: 0.76rem; color: var(--muted); line-height: 1.4; }
    .notif-time { font-family: 'Inter', sans-serif; font-size: 0.65rem; color: var(--gold); margin-top: 5px; }
    .notif-empty, .notif-loading { padding: 40px 20px; text-align: center; color: var(--muted); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.95rem; }
    @media (max-width: 640px) { .notif-dropdown { position: fixed; top: 68px; right: 10px; left: 10px; width: auto; max-width: none; } }

    /* Hero — solemn, engraved feel rather than the open-call energy of contest.html */
    .hero {
      position: relative; text-align: center; padding: 76px 32px 56px;
      background: var(--ink); color: var(--white);
      overflow: hidden;
    }
    .hero::before, .hero::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 1px;
      background: repeating-linear-gradient(180deg, transparent, transparent 6px, rgba(212,167,44,0.4) 6px, rgba(212,167,44,0.4) 7px);
    }
    .hero::before { left: 60px; }
    .hero::after  { right: 60px; }
    .presented-by { font-size: 0.62rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); margin-bottom: 22px; font-weight: 600; }
    .hero-title {
      font-family: var(--serif); font-style: italic; font-weight: 600;
      font-size: clamp(2.6rem, 6vw, 4.4rem); line-height: 1.05; margin-bottom: 18px;
      letter-spacing: -0.01em;
    }
    .hero-sub { font-size: 1rem; color: rgba(255,255,255,0.65); max-width: 520px; margin: 0 auto 34px; line-height: 1.65; }
    .btn { padding: 15px 34px; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; border: none; transition: all .25s; display: inline-block; text-transform: uppercase; }
    .btn-line-lt { background: transparent; color: var(--white); border: 1.5px solid rgba(255,255,255,0.4); border-radius: 2px; }
    .btn-line-lt:hover { background: var(--white); color: var(--ink); border-color: var(--white); }

    .content { max-width: 1120px; margin: 0 auto; padding: 56px 32px 90px; }

    .toolbar-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 16px; }
    .back-link { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 500; }
    .back-link:hover { color: var(--gold); }
    .count-note { font-size: 0.8rem; color: var(--muted); font-weight: 500; }

    .verse-roster { display: flex; flex-direction: column; }
    .verse-row {
      display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 24px;
      padding: 28px 8px; border-bottom: 1px solid var(--rule);
      cursor: pointer; transition: background .2s;
    }
    .verse-row:hover { background: var(--ivory); }
    .row-number { font-family: var(--serif); font-size: 1.8rem; font-style: italic; color: var(--gold-lt); font-weight: 600; text-align: center; }
    .row-status {
      display: inline-block; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      font-weight: 700; padding: 3px 10px; border-radius: 2px; margin-bottom: 10px;
      background: rgba(212,167,44,0.15); color: #92730f;
    }
    .row-title { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; margin-bottom: 8px; line-height: 1.2; }
    .row-host { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
    .row-host b { color: var(--ink); font-weight: 600; }

    .winners-inline { display: flex; gap: 18px; flex-wrap: wrap; }
    .winner-chip { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; }
    .winner-chip .tier-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tier-dot.gold   { background: var(--gold); }
    .tier-dot.silver { background: #B8BAC4; }
    .tier-dot.bronze { background: #B5723C; }
    .winner-chip b { font-weight: 600; }

    .row-meta { text-align: right; }
    .judged-date { font-size: 0.72rem; color: var(--muted); }
    .judged-date span { display: block; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; margin-bottom: 3px; }

    .empty-state { text-align: center; padding: 90px 20px; }
    .empty-state .icon { font-size: 2.4rem; margin-bottom: 18px; }
    .empty-state p { font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--muted); }
    .loading-state { text-align: center; padding: 90px 20px; color: var(--muted); font-size: 0.9rem; }

    @media (max-width: 720px) {
      .header { padding: 0 20px; }
      .hero { padding: 56px 20px 40px; }
      .hero::before, .hero::after { display: none; }
      .content { padding: 40px 18px 60px; }
      .verse-row { grid-template-columns: 40px 1fr; }
      .row-meta { grid-column: 1 / -1; text-align: left; margin-top: 12px; }
      .winners-inline { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="profile.html" class="pen-name" id="userPenName">…</a>
    <p class="header-brand">Hall of Verses</p>
    <nav class="header-icons">
      <a href="founder.html" title="Founder Dashboard" id="founderLink" style="display:none;">👑</a>
      <div class="notif-wrap" id="notifWrap">
        <button class="notif-bell-btn" id="notifBellBtn" title="Notifications">
          🔔
          <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-dropdown-header">
            <span>Notifications</span>
            <button class="notif-mark-all" id="notifMarkAllBtn">Mark all read</button>
          </div>
          <div class="notif-list" id="notifList">
            <div class="notif-loading">Loading…</div>
          </div>
        </div>
      </div>
      <a href="messages.html"      title="Messages">✉️</a>
      <a href="settings.html"      title="Settings">⚙️</a>
      <a href="profile.html"       title="Profile">👤</a>
    </nav>
  </header>

  <section class="hero">
    <p class="presented-by">Every Verdict, Remembered</p>
    <h1 class="hero-title">Hall of Verses</h1>
    <p class="hero-sub">Where every judged contest lives on. The rules that were set, the poets who entered, and the verdicts that were rendered.</p>
    <a class="btn btn-line-lt" href="contest.html">← Back to Open Contests</a>
  </section>

  <div class="content">
    <div class="toolbar-row">
      <a class="back-link" href="contest.html">← Currently open contests</a>
      <span class="count-note" id="countNote"></span>
    </div>

    <div id="verseGrid">
      <div class="loading-state">Loading the archive…</div>
    </div>
  </div>

  <script>
    const SUPA_URL = "https://nefqvdfhkeovwuneeozg.supabase.co";
    const SUPA_KEY = "sb_publishable_JLJ2a-Ks9LznxtOAYrtzEQ_Q6dzGsHh";
    const client   = supabase.createClient(SUPA_URL, SUPA_KEY);

    let currentUser = null;

    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function formatDate(dateStr) {
      if (!dateStr) return "";
      return new Date(dateStr).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    /* ── NOTIFICATIONS ── */
    let notifications = [];

    function timeAgoNotif(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "Just now";
      if (mins < 60) return mins + "m ago";
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + "h ago";
      const days = Math.floor(hours / 24);
      if (days < 7) return days + "d ago";
      return new Date(dateStr).toLocaleDateString();
    }

    async function initNotifications(userId) {
      await loadNotifications(userId);
      wireNotificationEvents(userId);
    }

    async function loadNotifications(userId) {
      const { data, error } = await client
        .from("notifications")
        .select("id, type, title, body, link_url, read, created_at")
        .eq("user_id", userId)
        .order("created_at", { ascending: false })
        .limit(30);

      if (error) {
        console.warn("Notifications load error:", error.message);
        document.getElementById("notifList").innerHTML = `<div class="notif-empty">Couldn't load notifications.</div>`;
        return;
      }

      notifications = data || [];
      renderNotifBadge();
      renderNotifList();
    }

    function renderNotifBadge() {
      const unreadCount = notifications.filter(n => !n.read).length;
      const badge = document.getElementById("notifBadge");
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 9 ? "9+" : unreadCount;
        badge.style.display = "flex";
      } else {
        badge.style.display = "none";
      }
    }

    function renderNotifList() {
      const el = document.getElementById("notifList");
      if (!notifications.length) {
        el.innerHTML = `<div class="notif-empty">You're all caught up.</div>`;
        return;
      }
      el.innerHTML = notifications.map(n => `
        <div class="notif-item ${n.read ? '' : 'unread'}" data-id="${n.id}" data-link="${escapeHtml(n.link_url || '')}">
          <p class="notif-title">${escapeHtml(n.title)}</p>
          ${n.body ? `<p class="notif-body">${escapeHtml(n.body)}</p>` : ''}
          <p class="notif-time">${timeAgoNotif(n.created_at)}</p>
        </div>
      `).join("");

      el.querySelectorAll(".notif-item").forEach(item => {
        item.addEventListener("click", async () => {
          const id = parseInt(item.dataset.id);
          const link = item.dataset.link;
          await markNotifRead(id);
          if (link) window.location.href = link;
        });
      });
    }

    async function markNotifRead(id) {
      const notif = notifications.find(n => n.id === id);
      if (!notif || notif.read) return;
      notif.read = true;
      renderNotifBadge();
      renderNotifList();
      await client.from("notifications").update({ read: true }).eq("id", id);
    }

    async function markAllNotifsRead(userId) {
      const unread = notifications.filter(n => !n.read);
      if (!unread.length) return;
      notifications.forEach(n => n.read = true);
      renderNotifBadge();
      renderNotifList();
      await client.from("notifications").update({ read: true }).eq("user_id", userId).eq("read", false);
    }

    function wireNotificationEvents(userId) {
      const bellBtn = document.getElementById("notifBellBtn");
      const dropdown = document.getElementById("notifDropdown");
      const wrap = document.getElementById("notifWrap");

      bellBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        dropdown.classList.toggle("open");
      });

      document.getElementById("notifMarkAllBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        markAllNotifsRead(userId);
      });

      document.addEventListener("click", (e) => {
        if (!wrap.contains(e.target)) dropdown.classList.remove("open");
      });
    }

    (async () => {
      const { data: sessionData } = await client.auth.getSession();
      currentUser = sessionData?.session?.user ?? null;
      if (!currentUser) { window.location.href = "login.html"; return; }

      const { data: profile } = await client
        .from("profiles")
        .select("pen_name, role")
        .eq("id", currentUser.id)
        .single();

      document.getElementById("userPenName").textContent = profile?.pen_name || "Nameless Voice";
      if (profile?.role === "founder" || profile?.role === "admin") {
        document.getElementById("founderLink").style.display = "inline-flex";
      }

      initNotifications(currentUser.id);
      loadHallOfVerses();
    })();

    async function loadHallOfVerses() {
      const { data, error } = await client
        .from("contests")
        .select("id, title, entry_type, judged_at, host_id, profiles!contests_host_id_fkey(pen_name)")
        .eq("status", "judged")
        .order("judged_at", { ascending: false });

      let contests;
      if (error) {
        console.warn("Join select failed, retrying flat select:", error.message);
        const flat = await client
          .from("contests")
          .select("id, title, entry_type, judged_at, host_id")
          .eq("status", "judged")
          .order("judged_at", { ascending: false });

        if (flat.error) {
          document.getElementById("verseGrid").innerHTML =
            `<div class="empty-state"><div class="icon">⚠</div><p>Couldn't load the archive: ${escapeHtml(flat.error.message)}</p></div>`;
          return;
        }
        contests = flat.data || [];

        const hostIds = [...new Set(contests.map(c => c.host_id))];
        if (hostIds.length) {
          const { data: hosts } = await client.from("profiles").select("id, pen_name").in("id", hostIds);
          const hostMap = Object.fromEntries((hosts||[]).map(h => [h.id, h.pen_name]));
          contests.forEach(c => c.host_pen_name = hostMap[c.host_id] || "Unknown");
        }
      } else {
        contests = (data || []).map(c => ({ ...c, host_pen_name: c.profiles?.pen_name || "Unknown" }));
      }

      if (!contests.length) {
        document.getElementById("verseGrid").innerHTML = `
          <div class="empty-state">
            <div class="icon">📜</div>
            <p>No verdicts have been rendered yet. The Hall awaits its first champions.</p>
          </div>`;
        document.getElementById("countNote").textContent = "";
        return;
      }

      document.getElementById("countNote").textContent =
        `${contests.length} judged ${contests.length === 1 ? 'contest' : 'contests'}`;

      // Pull winning entries for all these contests in one go, then group by contest
      const contestIds = contests.map(c => c.id);
      const { data: winningEntries } = await client
        .from("contest_entries")
        .select("contest_id, award, poems(pen_name)")
        .in("contest_id", contestIds)
        .not("award", "is", null);

      const winnersByContest = {};
      (winningEntries || []).forEach(e => {
        if (!winnersByContest[e.contest_id]) winnersByContest[e.contest_id] = {};
        if (e.award === "gold" || e.award === "silver" || e.award === "bronze") {
          winnersByContest[e.contest_id][e.award] = e.poems?.pen_name || "Unknown";
        }
      });

      const rows = contests.map((c, idx) => {
        const winners = winnersByContest[c.id] || {};
        const chips = [];
        if (winners.gold)   chips.push(`<div class="winner-chip"><span class="tier-dot gold"></span><span>Gold <b>${escapeHtml(winners.gold)}</b></span></div>`);
        if (winners.silver) chips.push(`<div class="winner-chip"><span class="tier-dot silver"></span><span>Silver <b>${escapeHtml(winners.silver)}</b></span></div>`);
        if (winners.bronze) chips.push(`<div class="winner-chip"><span class="tier-dot bronze"></span><span>Bronze <b>${escapeHtml(winners.bronze)}</b></span></div>`);

        const entryTypeLabel = c.entry_type === "open" ? "Open Entry"
          : c.entry_type === "new_write_only" ? "New Write Only"
          : "Prewrite Only";

        return `
          <div class="verse-row" onclick="window.location.href='contest-detail.html?id=${c.id}'">
            <div class="row-number">${String(idx + 1).padStart(2,'0')}</div>
            <div>
              <span class="row-status">Verdict Rendered</span>
              <p class="row-title">${escapeHtml(c.title)}</p>
              <p class="row-host">Hosted by <b>${escapeHtml(c.host_pen_name)}</b> · ${entryTypeLabel}</p>
              <div class="winners-inline">${chips.join('') || '<span style="font-size:0.8rem;color:var(--muted);">No podium winners recorded</span>'}</div>
            </div>
            <div class="row-meta">
              <p class="judged-date"><span>Judged</span>${formatDate(c.judged_at)}</p>
            </div>
          </div>`;
      }).join("");

      document.getElementById("verseGrid").innerHTML = `<div class="verse-roster">${rows}</div>`;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketplace — Pen Africa</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#07050b;--bg2:#0f0a1a;--bg3:#160d26;
      --purple:#7C3AED;--violet:#A78BFA;
      --rule:rgba(167,139,250,0.15);
      --text:#EDE8F5;--muted:#9585B8;--gold:#f59e0b;
      --coral:#E8563D;
      --serif:'Cormorant Garamond',serif;--sans:'Inter',system-ui,sans-serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
    a{text-decoration:none;color:inherit;}

    .header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 52px;height:68px;border-bottom:1px solid var(--rule);background:rgba(7,5,11,0.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;}
    .pen-name{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--violet);}
    .header-brand{text-align:center;font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);}
    .header-icons{justify-self:end;display:flex;gap:22px;font-size:1.1rem;align-items:center;}
    .header-icons a{opacity:0.55;transition:opacity .2s,transform .2s;}
    .header-icons a:hover{opacity:1;transform:scale(1.15);}

    .notif-wrap{position:relative;}
    .notif-bell-btn{background:none;border:none;font-size:1.1rem;cursor:pointer;opacity:0.55;transition:opacity .2s,transform .2s;position:relative;padding:0;line-height:1;color:inherit;font-family:inherit;}
    .notif-bell-btn:hover{opacity:1;transform:scale(1.15);}
    .notif-badge{position:absolute;top:-6px;right:-8px;background:#dc2626;color:#fff;font-size:0.6rem;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:'Inter',sans-serif;}
    .notif-dropdown{display:none;position:absolute;top:calc(100% + 14px);right:0;width:340px;max-width:90vw;max-height:480px;background:var(--bg2);border:1px solid var(--rule);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,0.5);overflow:hidden;flex-direction:column;z-index:200;}
    .notif-dropdown.open{display:flex;}
    .notif-dropdown-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule);font-family:'Inter',sans-serif;font-weight:600;font-size:0.85rem;color:var(--text);}
    .notif-mark-all{background:none;border:none;color:var(--violet);font-size:0.72rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
    .notif-mark-all:hover{text-decoration:underline;}
    .notif-list{overflow-y:auto;flex:1;}
    .notif-item{display:block;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s;text-align:left;}
    .notif-item:hover{background:var(--bg3);}
    .notif-item.unread{background:rgba(167,139,250,0.06);}
    .notif-item.unread::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--violet);margin-right:6px;vertical-align:middle;}
    .notif-title{font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:600;color:var(--text);margin-bottom:3px;}
    .notif-body{font-family:'Inter',sans-serif;font-size:0.76rem;color:var(--muted);line-height:1.4;}
    .notif-time{font-family:'Inter',sans-serif;font-size:0.65rem;color:var(--violet);margin-top:5px;}
    .notif-empty,.notif-loading{padding:40px 20px;text-align:center;color:var(--muted);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.95rem;}
    @media(max-width:640px){.notif-dropdown{position:fixed;top:68px;right:10px;left:10px;width:auto;max-width:none;}}

    .search-hero{padding:56px 32px 30px;text-align:center;max-width:680px;margin:0 auto;}
    .search-eyebrow{font-size:0.65rem;letter-spacing:0.24em;text-transform:uppercase;color:var(--violet);margin-bottom:14px;font-weight:600;}
    .search-title{font-family:var(--serif);font-style:italic;font-size:2.2rem;margin-bottom:10px;}
    .balance-note{font-size:0.85rem;color:var(--muted);}
    .balance-note b{color:var(--gold);}

    .content{max-width:980px;margin:0 auto;padding:20px 32px 90px;}

    .cat-tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:28px;overflow-x:auto;}
    .cat-tab{padding:10px 4px;margin-right:28px;font-size:0.78rem;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
    .cat-tab.active{color:var(--text);border-bottom-color:var(--purple);}

    .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
    .item-card{background:var(--bg2);border:1px solid var(--rule);border-radius:10px;overflow:hidden;transition:border-color .2s,transform .2s;}
    .item-card:hover{border-color:rgba(167,139,250,0.4);transform:translateY(-2px);}
    .item-preview{width:100%;height:140px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:2.4rem;overflow:hidden;position:relative;}
    .item-preview img{width:100%;height:100%;object-fit:cover;}
    .item-limited-badge{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--bg);font-size:0.6rem;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;}
    .item-body{padding:14px 16px;}
    .item-name{font-weight:600;font-size:0.9rem;margin-bottom:4px;}
    .item-desc{font-size:0.78rem;color:var(--muted);margin-bottom:10px;line-height:1.4;min-height:2.2em;}
    .item-footer{display:flex;justify-content:space-between;align-items:center;}
    .item-price{font-family:var(--serif);color:var(--gold);font-weight:600;font-size:1.05rem;}
    .item-buy-btn{font-size:0.75rem;padding:7px 14px;border-radius:6px;border:1px solid var(--purple);background:var(--purple);color:#fff;cursor:pointer;}
    .item-buy-btn:hover{background:#6d28d9;}
    .item-buy-btn:disabled{opacity:0.4;cursor:not-allowed;}
    .item-owned-tag{font-size:0.72rem;color:var(--violet);font-weight:600;}
    .item-soldout-tag{font-size:0.72rem;color:var(--coral);font-weight:600;}

    .empty-state{text-align:center;padding:70px 20px;}
    .empty-state .icon{font-size:2.2rem;margin-bottom:14px;}
    .empty-state p{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--muted);}
    .loading-state{text-align:center;padding:70px 20px;color:var(--muted);font-size:0.88rem;}

    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);border-radius:8px;padding:13px 24px;font-size:0.85rem;font-weight:600;opacity:0;transition:all .3s;z-index:600;pointer-events:none;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>

  <header class="header">
    <a href="profile.html" class="pen-name" id="userPenName">…</a>
    <p class="header-brand">Marketplace</p>
    <nav class="header-icons">
      <a href="founder.html" title="Founder Dashboard" id="founderLink" style="display:none;">👑</a>
      <div class="notif-wrap" id="notifWrap">
        <button class="notif-bell-btn" id="notifBellBtn" title="Notifications">
          🔔
          <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-dropdown-header">
            <span>Notifications</span>
            <button class="notif-mark-all" id="notifMarkAllBtn">Mark all read</button>
          </div>
          <div class="notif-list" id="notifList">
            <div class="notif-loading">Loading…</div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <section class="search-hero">
    <p class="search-eyebrow">Adorn Your Craft</p>
    <h1 class="search-title">Marketplace</h1>
    <p class="balance-note">Your balance: <b id="userBalance">…</b> points</p>
  </section>

  <div class="content">
    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="all">All</button>
      <button class="cat-tab" data-cat="border">Borders</button>
      <button class="cat-tab" data-cat="background">Backgrounds</button>
      <button class="cat-tab" data-cat="sticker">Stickers</button>
      <button class="cat-tab" data-cat="frame">Profile Frames</button>
      <button class="cat-tab" data-cat="theme">Profile Themes</button>
    </div>

    <div id="itemGrid">
      <div class="loading-state">Loading marketplace…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPA_URL = "https://nefqvdfhkeovwuneeozg.supabase.co";
    const SUPA_KEY = "sb_publishable_JLJ2a-Ks9LznxtOAYrtzEQ_Q6dzGsHh";
    const client   = supabase.createClient(SUPA_URL, SUPA_KEY);

    let currentUser = null;
    let myBalance = 0;
    let allItems = [];
    let myOwnedItemIds = new Set();
    let activeCategory = "all";

    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2800);
    }

    /* ── NOTIFICATIONS ── */
    let notifications = [];
    function timeAgoNotif(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "Just now";
      if (mins < 60) return mins + "m ago";
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + "h ago";
      const days = Math.floor(hours / 24);
      if (days < 7) return days + "d ago";
      return new Date(dateStr).toLocaleDateString();
    }
    async function initNotifications(userId) {
      await loadNotifications(userId);
      wireNotificationEvents(userId);
    }
    async function loadNotifications(userId) {
      const { data, error } = await client.from("notifications").select("id, type, title, body, link_url, read, created_at").eq("user_id", userId).order("created_at", { ascending: false }).limit(30);
      if (error) { document.getElementById("notifList").innerHTML = `<div class="notif-empty">Couldn't load notifications.</div>`; return; }
      notifications = data || [];
      renderNotifBadge(); renderNotifList();
    }
    function renderNotifBadge() {
      const unreadCount = notifications.filter(n => !n.read).length;
      const badge = document.getElementById("notifBadge");
      if (unreadCount > 0) { badge.textContent = unreadCount > 9 ? "9+" : unreadCount; badge.style.display = "flex"; }
      else badge.style.display = "none";
    }
    function renderNotifList() {
      const el = document.getElementById("notifList");
      if (!notifications.length) { el.innerHTML = `<div class="notif-empty">You're all caught up.</div>`; return; }
      el.innerHTML = notifications.map(n => `
        <div class="notif-item ${n.read ? '' : 'unread'}" data-id="${n.id}" data-link="${escapeHtml(n.link_url || '')}">
          <p class="notif-title">${escapeHtml(n.title)}</p>
          ${n.body ? `<p class="notif-body">${escapeHtml(n.body)}</p>` : ''}
          <p class="notif-time">${timeAgoNotif(n.created_at)}</p>
        </div>`).join("");
      el.querySelectorAll(".notif-item").forEach(item => {
        item.addEventListener("click", async () => {
          const id = parseInt(item.dataset.id); const link = item.dataset.link;
          await markNotifRead(id);
          if (link) window.location.href = link;
        });
      });
    }
    async function markNotifRead(id) {
      const notif = notifications.find(n => n.id === id);
      if (!notif || notif.read) return;
      notif.read = true; renderNotifBadge(); renderNotifList();
      await client.from("notifications").update({ read: true }).eq("id", id);
    }
    async function markAllNotifsRead(userId) {
      const unread = notifications.filter(n => !n.read);
      if (!unread.length) return;
      notifications.forEach(n => n.read = true); renderNotifBadge(); renderNotifList();
      await client.from("notifications").update({ read: true }).eq("user_id", userId).eq("read", false);
    }
    function wireNotificationEvents(userId) {
      const bellBtn = document.getElementById("notifBellBtn");
      const dropdown = document.getElementById("notifDropdown");
      const wrap = document.getElementById("notifWrap");
      bellBtn.addEventListener("click", (e) => { e.stopPropagation(); dropdown.classList.toggle("open"); });
      document.getElementById("notifMarkAllBtn").addEventListener("click", (e) => { e.stopPropagation(); markAllNotifsRead(userId); });
      document.addEventListener("click", (e) => { if (!wrap.contains(e.target)) dropdown.classList.remove("open"); });
    }

    (async () => {
      const { data: sessionData } = await client.auth.getSession();
      currentUser = sessionData?.session?.user ?? null;
      if (!currentUser) { window.location.href = "login.html"; return; }

      const { data: profile } = await client.from("profiles").select("pen_name, role, points_balance").eq("id", currentUser.id).single();
      document.getElementById("userPenName").textContent = profile?.pen_name || "Nameless Voice";
      myBalance = profile?.points_balance || 0;
      document.getElementById("userBalance").textContent = myBalance;
      if (profile?.role === "founder" || profile?.role === "admin") {
        document.getElementById("founderLink").style.display = "inline-flex";
      }

      initNotifications(currentUser.id);
      loadMarketplace();
    })();

    async function loadMarketplace() {
      const [itemsRes, ownedRes] = await Promise.all([
        client.from("marketplace_items").select("id, category, name, description, preview_url, price, is_limited_edition, limited_quantity").eq("enabled", true).order("created_at", { ascending: false }),
        client.from("user_purchases").select("item_id").eq("user_id", currentUser.id)
      ]);

      if (itemsRes.error) {
        document.getElementById("itemGrid").innerHTML = `<div class="empty-state"><div class="icon">⚠</div><p>Couldn't load the marketplace: ${escapeHtml(itemsRes.error.message)}</p></div>`;
        return;
      }

      allItems = itemsRes.data || [];
      myOwnedItemIds = new Set((ownedRes.data || []).map(p => p.item_id));

      // Sold counts for limited-edition items
      const limitedIds = allItems.filter(i => i.is_limited_edition).map(i => i.id);
      if (limitedIds.length) {
        const { data: purchases } = await client.from("user_purchases").select("item_id").in("item_id", limitedIds);
        const soldMap = {};
        (purchases || []).forEach(p => { soldMap[p.item_id] = (soldMap[p.item_id] || 0) + 1; });
        allItems.forEach(i => { if (i.is_limited_edition) i.sold_count = soldMap[i.id] || 0; });
      }

      renderItems();
    }

    function renderItems() {
      const items = activeCategory === "all" ? allItems : allItems.filter(i => i.category === activeCategory);

      if (!items.length) {
        document.getElementById("itemGrid").innerHTML = `<div class="empty-state"><div class="icon">🎨</div><p>Nothing here yet — check back soon.</p></div>`;
        return;
      }

      document.getElementById("itemGrid").innerHTML = `<div class="item-grid">` + items.map(i => {
        const preview = i.preview_url ? `<img src="${escapeHtml(i.preview_url)}" alt=""/>` : "🎨";
        const owned = myOwnedItemIds.has(i.id);
        const soldOut = i.is_limited_edition && i.limited_quantity !== null && (i.sold_count ?? 0) >= i.limited_quantity;

        let footerRight;
        if (owned) {
          footerRight = `<span class="item-owned-tag">✓ Owned</span>`;
        } else if (soldOut) {
          footerRight = `<span class="item-soldout-tag">Sold Out</span>`;
        } else {
          footerRight = `<button class="item-buy-btn" ${myBalance < i.price ? 'disabled' : ''} onclick="purchaseItem(${i.id}, ${JSON.stringify(i.name)}, ${i.price})">Buy</button>`;
        }

        return `
          <div class="item-card">
            <div class="item-preview">
              ${preview}
              ${i.is_limited_edition ? `<span class="item-limited-badge">${i.sold_count ?? 0}/${i.limited_quantity} left</span>` : ''}
            </div>
            <div class="item-body">
              <p class="item-name">${escapeHtml(i.name)}</p>
              <p class="item-desc">${escapeHtml(i.description || '')}</p>
              <div class="item-footer">
                <span class="item-price">${i.price} pts</span>
                ${footerRight}
              </div>
            </div>
          </div>`;
      }).join("") + `</div>`;
    }

    document.querySelectorAll("#catTabs .cat-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll("#catTabs .cat-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeCategory = tab.dataset.cat;
        renderItems();
      });
    });

    async function purchaseItem(itemId, itemName, price) {
      if (!confirm(`Buy "${itemName}" for ${price} points? This is permanent — no refunds.`)) return;

      const { data, error } = await client.rpc("purchase_marketplace_item", { p_item_id: itemId });

      if (error) { toast(error.message); return; }

      myBalance -= price;
      document.getElementById("userBalance").textContent = myBalance;
      myOwnedItemIds.add(itemId);
      renderItems();
      toast(`✓ Purchased ${data.item_name}!`);
    }
  </script>
</body>
</html>

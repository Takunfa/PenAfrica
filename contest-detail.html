<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contest — Pen Africa</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white:   #ffffff;
      --ivory:   #FFF9EC;
      --gold:    #D4A72C;
      --gold-lt: #F0DFA3;
      --ink:     #2B2440;
      --muted:   #8B7BA8;
      --coral:   #E8563D;
      --rule:    rgba(43,36,64,0.10);
      --serif:   'Cormorant Garamond', serif;
      --sans:    'Inter', system-ui, sans-serif;
    }
    body { background: var(--white); color: var(--ink); font-family: var(--sans); min-height: 100vh; }
    a { text-decoration: none; color: inherit; }

    .header {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 0 52px; height: 84px; border-bottom: 1px solid var(--rule);
    }
    .pen-name { font-family: var(--serif); font-style: italic; font-size: 1.05rem; color: var(--ink); }
    .header-brand { text-align: center; font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .header-icons { justify-self: end; display: flex; gap: 22px; font-size: 1.1rem; align-items: center; }
    .header-icons a { opacity: 0.5; transition: opacity .2s, transform .2s; }
    .header-icons a:hover { opacity: 1; transform: scale(1.15); }

    .notif-wrap { position: relative; }
    .notif-bell-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; opacity: 0.5; transition: opacity .2s, transform .2s; position: relative; padding: 0; line-height: 1; color: inherit; font-family: inherit; }
    .notif-bell-btn:hover { opacity: 1; transform: scale(1.15); }
    .notif-badge { position: absolute; top: -6px; right: -8px; background: var(--coral); color: #fff; font-size: 0.6rem; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; font-family: 'Inter', sans-serif; }
    .notif-dropdown { display: none; position: absolute; top: calc(100% + 14px); right: 0; width: 340px; max-width: 90vw; max-height: 480px; background: var(--white); border: 1px solid var(--rule); border-radius: 4px; box-shadow: 0 16px 40px rgba(43,36,64,0.2); overflow: hidden; flex-direction: column; z-index: 200; }
    .notif-dropdown.open { display: flex; }
    .notif-dropdown-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--rule); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--ink); }
    .notif-mark-all { background: none; border: none; color: var(--gold); font-size: 0.72rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .notif-mark-all:hover { text-decoration: underline; }
    .notif-list { overflow-y: auto; flex: 1; }
    .notif-item { display: block; padding: 12px 16px; border-bottom: 1px solid var(--rule); cursor: pointer; transition: background .15s; text-align: left; }
    .notif-item:hover { background: var(--ivory); }
    .notif-item.unread { background: rgba(212,167,44,0.07); }
    .notif-item.unread::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-right: 6px; vertical-align: middle; }
    .notif-title { font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
    .notif-body { font-family: 'Inter', sans-serif; font-size: 0.76rem; color: var(--muted); line-height: 1.4; }
    .notif-time { font-family: 'Inter', sans-serif; font-size: 0.65rem; color: var(--gold); margin-top: 5px; }
    .notif-empty, .notif-loading { padding: 40px 20px; text-align: center; color: var(--muted); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.95rem; }
    @media (max-width: 640px) { .notif-dropdown { position: fixed; top: 68px; right: 10px; left: 10px; width: auto; max-width: none; } }
    .back-crumb { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
    .back-crumb:hover { color: var(--gold); }

    .content { max-width: 940px; margin: 0 auto; padding: 36px 32px 100px; }

    .reminder-banner {
      background: rgba(232,86,61,0.08); border-left: 3px solid var(--coral); border-radius: 2px;
      padding: 16px 22px; margin-bottom: 28px; font-size: 0.86rem; color: var(--ink);
      display: flex; align-items: center; gap: 12px;
    }

    /* Ceremonial contest header */
    .contest-head {
      text-align: center; padding: 44px 20px 40px; background: var(--ivory);
      margin: 0 -32px 40px; border-bottom: 1px solid var(--rule);
    }
    .status-pill {
      display: inline-block; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 5px 14px; border-radius: 2px; font-weight: 700; margin-bottom: 20px;
    }
    .status-open { background: rgba(52,168,83,0.12); color: #2e7d47; }
    .status-closed_for_judging { background: rgba(232,86,61,0.12); color: var(--coral); }
    .status-judged { background: rgba(212,167,44,0.15); color: #92730f; }
    .contest-title { font-family: var(--serif); font-size: clamp(2rem, 4.5vw, 3rem); font-style: italic; font-weight: 600; margin-bottom: 14px; line-height: 1.15; }
    .contest-host { font-size: 0.9rem; color: var(--muted); }
    .contest-host b { color: var(--ink); font-weight: 600; }

    .rules-box { background: var(--white); border: 1px solid var(--rule); border-radius: 2px; padding: 26px 30px; margin-bottom: 24px; }
    .rules-label { font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 10px; }
    .rules-text { font-size: 0.94rem; line-height: 1.75; white-space: pre-wrap; }

    .prize-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 32px; justify-content: center; }
    .prize-tag {
      display: flex; align-items: center; gap: 8px; background: var(--white); border: 1px solid var(--rule);
      border-radius: 20px; padding: 8px 16px 8px 8px; font-size: 0.82rem; font-weight: 600;
    }
    .prize-tag .medallion { width: 22px; height: 22px; }

    .section-title { font-family: var(--serif); font-style: italic; font-size: 1.6rem; margin: 40px 0 8px; text-align: center; }
    .entry-count-note { font-size: 0.82rem; color: var(--muted); margin-bottom: 24px; text-align: center; }

    /* Podium — the signature element, only shown once judged */
    .podium-wrap { margin: 40px 0 56px; }
    .podium { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 14px; max-width: 620px; margin: 0 auto; }
    .podium-slot { text-align: center; }
    .podium-medal {
      width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 12px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 1.6rem; font-weight: 700; color: #fff;
      box-shadow: inset 0 -4px 8px rgba(0,0,0,0.2), 0 6px 16px rgba(0,0,0,0.15);
      position: relative;
    }
    .podium-medal::after {
      content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 3px; height: 14px; background: var(--coral);
    }
    .podium-slot.gold .podium-medal   { background: linear-gradient(155deg, #F0DFA3, #D4A72C); }
    .podium-slot.silver .podium-medal { background: linear-gradient(155deg, #F1F1F4, #B8BAC4); }
    .podium-slot.bronze .podium-medal { background: linear-gradient(155deg, #E8C4A0, #B5723C); }
    .podium-name { font-family: var(--serif); font-weight: 600; font-size: 1.15rem; margin-bottom: 3px; }
    .podium-prize { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
    .podium-base { background: var(--ivory); border: 1px solid var(--rule); border-top: 3px solid var(--gold); border-radius: 2px 2px 0 0; padding: 14px 10px; }
    .podium-slot.gold .podium-base   { height: 92px; border-top-color: var(--gold); }
    .podium-slot.silver .podium-base { height: 66px; border-top-color: #B8BAC4; }
    .podium-slot.bronze .podium-base { height: 48px; border-top-color: #B5723C; }
    .podium-comment { font-family: var(--serif); font-style: italic; font-size: 0.8rem; color: var(--ink); line-height: 1.4; }
    .podium-rank-label { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

    .special-list { max-width: 500px; margin: 24px auto 0; display: flex; flex-direction: column; gap: 10px; }
    .special-item { display: flex; align-items: center; gap: 12px; background: var(--ivory); border-radius: 2px; padding: 12px 16px; }
    .special-item .medallion { width: 26px; height: 26px; flex-shrink: 0; }
    .special-item-name { font-family: var(--serif); font-weight: 600; font-size: 0.95rem; }
    .special-item-meta { font-size: 0.76rem; color: var(--muted); }

    /* Register box */
    .register-box { border: 1.5px dashed var(--rule); border-radius: 2px; padding: 28px; margin-bottom: 34px; }
    .register-box.filled { border-style: solid; background: var(--ivory); text-align: center; font-size: 0.92rem; }
    .register-box b.rb-title { font-family: var(--serif); font-style: italic; font-size: 1.2rem; display: block; margin-bottom: 16px; }
    .entry-type-radios { display: flex; gap: 10px; margin: 0 0 20px; }
    .entry-radio-btn {
      flex: 1; padding: 12px; text-align: center; border: 1px solid var(--rule); border-radius: 2px;
      cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--muted); transition: all .15s;
    }
    .entry-radio-btn.selected { background: var(--gold); color: #fff; border-color: var(--gold); }
    .register-panel { display: none; }
    .register-panel.active { display: block; }
    select, textarea, input[type=text] {
      width: 100%; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 2px;
      font-family: var(--sans); font-size: 0.9rem; background: var(--white); color: var(--ink); margin-top: 6px;
    }
    textarea { min-height: 200px; font-family: var(--serif); font-size: 1.05rem; line-height: 1.8; resize: vertical; }
    .field-label { display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 16px; }
    .field-label:first-child { margin-top: 0; }
    .btn { padding: 13px 28px; border-radius: 2px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; cursor: pointer; border: none; transition: all .2s; }
    .btn-gold { background: var(--gold); color: #fff; box-shadow: 0 6px 16px rgba(212,167,44,0.3); }
    .btn-gold:hover { background: #c19722; }
    .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-line { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); }
    .btn-line:hover { background: var(--ink); color: #fff; }

    /* Entries — field roster style, matching listing page */
    .entries-roster { display: flex; flex-direction: column; }
    .entry-row {
      display: grid; grid-template-columns: 44px 1fr; gap: 18px; padding: 22px 4px;
      border-bottom: 1px solid var(--rule); align-items: flex-start;
    }
    .entry-row.awarded { background: var(--ivory); margin: 0 -20px; padding-left: 24px; padding-right: 24px; border-radius: 2px; }
    .entry-number { font-family: var(--serif); font-size: 1.3rem; font-style: italic; color: var(--gold-lt); font-weight: 600; }
    .entry-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 10px; }
    .entry-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; }
    .entry-author { font-size: 0.8rem; color: var(--muted); }
    .award-badge { font-size: 0.68rem; font-weight: 700; padding: 4px 11px; border-radius: 2px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .award-gold { background: rgba(212,167,44,0.15); color: #92730f; }
    .award-silver { background: #f1f1f4; color: #6b6d76; }
    .award-bronze { background: #f5e4d3; color: #8a5327; }
    .award-special { background: #ede0f7; color: #6b3fa0; }
    .entry-excerpt { font-family: var(--serif); font-size: 0.92rem; font-style: italic; color: var(--ink); line-height: 1.65; margin: 8px 0; }
    .entry-meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .entry-link { font-size: 0.78rem; color: var(--gold); font-weight: 700; }
    .host-comment { font-size: 0.82rem; color: var(--muted); margin-top: 10px; font-style: italic; border-top: 1px solid var(--rule); padding-top: 10px; }

    .judge-select-row { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
    .judge-select-row select, .judge-select-row input { width: auto; margin-top: 0; }

    .empty-state { text-align: center; padding: 60px 20px; font-family: var(--serif); font-style: italic; color: var(--muted); }

    .judge-panel { background: var(--ivory); border-radius: 2px; padding: 28px; margin-top: 30px; border-top: 3px solid var(--gold); text-align: center; }
    .judge-panel h3 { font-family: var(--serif); font-style: italic; font-size: 1.5rem; margin-bottom: 8px; }
    .judge-panel p.sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 22px; max-width: 460px; margin-left: auto; margin-right: auto; }

    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--ink); color: #fff; border-radius: 2px; padding: 14px 26px;
      font-size: 0.85rem; opacity: 0; transition: all .3s; z-index: 600; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .loading-state { text-align: center; padding: 90px 20px; color: var(--muted); }

    @media (max-width: 640px) {
      .header { padding: 0 20px; }
      .content { padding: 26px 18px 80px; }
      .contest-head { margin: 0 -18px 32px; padding: 36px 16px 32px; }
      .entry-type-radios { flex-direction: column; }
      .podium { max-width: 100%; }
      .podium-medal { width: 52px; height: 52px; font-size: 1.2rem; }
      .podium-name { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="profile.html" class="pen-name" id="userPenName">…</a>
    <p class="header-brand">Contest</p>
    <nav class="header-icons">
      <a href="founder.html" title="Founder Dashboard" id="founderLink" style="display:none;">👑</a>
      <div class="notif-wrap" id="notifWrap">
        <button class="notif-bell-btn" id="notifBellBtn" title="Notifications">
          🔔
          <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-dropdown-header">
            <span>Notifications</span>
            <button class="notif-mark-all" id="notifMarkAllBtn">Mark all read</button>
          </div>
          <div class="notif-list" id="notifList">
            <div class="notif-loading">Loading…</div>
          </div>
        </div>
      </div>
      <a href="messages.html"      title="Messages">✉️</a>
      <a href="settings.html"      title="Settings">⚙️</a>
      <a href="profile.html"       title="Profile">👤</a>
    </nav>
  </header>

  <div class="content">
    <a href="contest.html" class="back-crumb">← All Contests</a>

    <div id="pageBody">
      <div class="loading-state">Loading contest…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPA_URL = "https://nefqvdfhkeovwuneeozg.supabase.co";
    const SUPA_KEY = "sb_publishable_JLJ2a-Ks9LznxtOAYrtzEQ_Q6dzGsHh";
    const client   = supabase.createClient(SUPA_URL, SUPA_KEY);

    const params = new URLSearchParams(window.location.search);
    const contestId = params.get("id");

    let currentUser = null;
    let myProfile = null;
    let contest = null;
    let entries = [];
    let selectedEntryMode = null;

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2800);
    }
    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function excerpt(text, len) {
      const plain = (text || "").replace(/<[^>]*>/g, "");
      return plain.slice(0, len || 140).trim() + (plain.length > (len||140) ? "…" : "");
    }

    /* ── NOTIFICATIONS ── */
    let notifications = [];

    function timeAgoNotif(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "Just now";
      if (mins < 60) return mins + "m ago";
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + "h ago";
      const days = Math.floor(hours / 24);
      if (days < 7) return days + "d ago";
      return new Date(dateStr).toLocaleDateString();
    }

    async function initNotifications(userId) {
      await loadNotifications(userId);
      wireNotificationEvents(userId);
    }

    async function loadNotifications(userId) {
      const { data, error } = await client
        .from("notifications")
        .select("id, type, title, body, link_url, read, created_at")
        .eq("user_id", userId)
        .order("created_at", { ascending: false })
        .limit(30);

      if (error) {
        console.warn("Notifications load error:", error.message);
        document.getElementById("notifList").innerHTML = `<div class="notif-empty">Couldn't load notifications.</div>`;
        return;
      }

      notifications = data || [];
      renderNotifBadge();
      renderNotifList();
    }

    function renderNotifBadge() {
      const unreadCount = notifications.filter(n => !n.read).length;
      const badge = document.getElementById("notifBadge");
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 9 ? "9+" : unreadCount;
        badge.style.display = "flex";
      } else {
        badge.style.display = "none";
      }
    }

    function renderNotifList() {
      const el = document.getElementById("notifList");
      if (!notifications.length) {
        el.innerHTML = `<div class="notif-empty">You're all caught up.</div>`;
        return;
      }
      el.innerHTML = notifications.map(n => `
        <div class="notif-item ${n.read ? '' : 'unread'}" data-id="${n.id}" data-link="${escapeHtml(n.link_url || '')}">
          <p class="notif-title">${escapeHtml(n.title)}</p>
          ${n.body ? `<p class="notif-body">${escapeHtml(n.body)}</p>` : ''}
          <p class="notif-time">${timeAgoNotif(n.created_at)}</p>
        </div>
      `).join("");

      el.querySelectorAll(".notif-item").forEach(item => {
        item.addEventListener("click", async () => {
          const id = parseInt(item.dataset.id);
          const link = item.dataset.link;
          await markNotifRead(id);
          if (link) window.location.href = link;
        });
      });
    }

    async function markNotifRead(id) {
      const notif = notifications.find(n => n.id === id);
      if (!notif || notif.read) return;
      notif.read = true;
      renderNotifBadge();
      renderNotifList();
      await client.from("notifications").update({ read: true }).eq("id", id);
    }

    async function markAllNotifsRead(userId) {
      const unread = notifications.filter(n => !n.read);
      if (!unread.length) return;
      notifications.forEach(n => n.read = true);
      renderNotifBadge();
      renderNotifList();
      await client.from("notifications").update({ read: true }).eq("user_id", userId).eq("read", false);
    }

    function wireNotificationEvents(userId) {
      const bellBtn = document.getElementById("notifBellBtn");
      const dropdown = document.getElementById("notifDropdown");
      const wrap = document.getElementById("notifWrap");

      bellBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        dropdown.classList.toggle("open");
      });

      document.getElementById("notifMarkAllBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        markAllNotifsRead(userId);
      });

      document.addEventListener("click", (e) => {
        if (!wrap.contains(e.target)) dropdown.classList.remove("open");
      });
    }

    if (!contestId) {
      document.getElementById("pageBody").innerHTML = `<div class="empty-state">No contest specified.</div>`;
    } else {
      init();
    }

    async function init() {
      const { data: sessionData } = await client.auth.getSession();
      currentUser = sessionData?.session?.user ?? null;
      if (!currentUser) { window.location.href = "login.html"; return; }

      const { data: profile } = await client
        .from("profiles")
        .select("id, pen_name, role, points_balance")
        .eq("id", currentUser.id)
        .single();
      myProfile = profile;
      document.getElementById("userPenName").textContent = profile?.pen_name || "Nameless Voice";
      if (profile?.role === "founder" || profile?.role === "admin") {
        document.getElementById("founderLink").style.display = "inline-flex";
      }

      initNotifications(currentUser.id);
      await loadContest();
    }

    async function loadContest() {
      const { data: c, error } = await client.from("contests").select("*").eq("id", contestId).single();
      if (error || !c) {
        document.getElementById("pageBody").innerHTML = `<div class="empty-state">Contest not found.</div>`;
        return;
      }
      contest = c;

      const { data: host } = await client.from("profiles").select("pen_name").eq("id", c.host_id).single();
      contest.host_pen_name = host?.pen_name || "Unknown";

      const { data: entryRows } = await client
        .from("contest_entries")
        .select("id, poem_id, entrant_id, award, special_slot_index, host_comment, registered_at, poems(title, content, pen_name)")
        .eq("contest_id", contestId)
        .order("registered_at", { ascending: true });

      entries = entryRows || [];

      render();
    }

    function isHost() { return contest.host_id === currentUser.id; }
    function myEntry() { return entries.find(e => e.entrant_id === currentUser.id); }

    function render() {
      const c = contest;
      const chips = [];
      if (c.gold_prize > 0)   chips.push(`<span class="prize-tag"><span class="medallion gold"></span>Gold — ${c.gold_prize}pts</span>`);
      if (c.silver_prize > 0) chips.push(`<span class="prize-tag"><span class="medallion silver"></span>Silver — ${c.silver_prize}pts</span>`);
      if (c.bronze_prize > 0) chips.push(`<span class="prize-tag"><span class="medallion bronze"></span>Bronze — ${c.bronze_prize}pts</span>`);
      (c.special_prizes || []).forEach((p, i) => chips.push(`<span class="prize-tag"><span class="medallion special"></span>Special ${i+1} — ${p}pts</span>`));

      const entryTypeLabel = c.entry_type === "open" ? "Open entry — new writes or existing poems"
        : c.entry_type === "new_write_only" ? "New Write only"
        : "Prewrite only — existing published poems";

      let reminderHtml = "";
      if (c.status === "closed_for_judging" && c.closed_at) {
        const daysSince = (Date.now() - new Date(c.closed_at).getTime()) / 86400000;
        if (daysSince > 3) {
          reminderHtml = `<div class="reminder-banner">This contest closed ${Math.floor(daysSince)} days ago and still hasn't been judged. ${isHost() ? "Your entrants are waiting on a verdict." : "The host hasn't announced winners yet."}</div>`;
        }
      }

      const statusLabel = c.status === 'closed_for_judging' ? 'In Deliberation' : c.status === 'judged' ? 'Verdict Rendered' : 'Open for Entry';

      let body = `
        ${reminderHtml}
        <div class="contest-head">
          <span class="status-pill status-${c.status}">${statusLabel}</span>
          <h1 class="contest-title">${escapeHtml(c.title)}</h1>
          <p class="contest-host">Hosted by <b>${escapeHtml(c.host_pen_name)}</b> · ${entryTypeLabel}</p>
        </div>
        <div class="rules-box">
          <p class="rules-label">The Rules</p>
          <p class="rules-text">${escapeHtml(c.rules)}</p>
        </div>
        <div class="prize-strip">${chips.join("")}</div>
      `;

      // Podium — only once judged
      if (c.status === "judged") {
        body += renderPodium();
      }

      if (c.status === "open" && !isHost() && !myEntry()) {
        body += renderRegisterBox();
      } else if (c.status === "open" && !isHost() && myEntry()) {
        body += `<div class="register-box filled">You've entered this contest with "<b>${escapeHtml(myEntry().poems?.title || "your poem")}</b>". Good luck.</div>`;
      }

      if (isHost() && c.status === "open") {
        body += `<div style="text-align:center;margin:24px 0;"><button class="btn btn-line" id="closeContestBtn">Close Entries & Move to Judging</button></div>`;
      }

      if (c.status !== "judged") {
        body += `<h2 class="section-title">The Field</h2>`;
        body += `<p class="entry-count-note">${entries.length} ${entries.length === 1 ? 'poem has' : 'poems have'} entered this contest.</p>`;
      } else {
        body += `<h2 class="section-title">All Entries</h2>`;
      }

      if (!entries.length) {
        body += `<div class="empty-state">No entries yet. Be the first.</div>`;
      } else {
        body += `<div class="entries-roster">` + entries.map((e,i) => renderEntryRow(e,i)).join("") + `</div>`;
      }

      if (isHost() && c.status === "closed_for_judging" && entries.length > 0) {
        body += renderJudgePanel();
      }

      document.getElementById("pageBody").innerHTML = body;
      wireUpEvents();
    }

    function renderPodium() {
      const c = contest;
      const goldEntry = entries.find(e => e.award === "gold");
      const silverEntry = entries.find(e => e.award === "silver");
      const bronzeEntry = entries.find(e => e.award === "bronze");
      const specialEntries = entries.filter(e => e.award === "special").sort((a,b) => (a.special_slot_index||0) - (b.special_slot_index||0));

      function slot(entry, tier, prize, initial) {
        if (!entry) return `<div class="podium-slot ${tier}"><div class="podium-medal" style="opacity:0.25;">—</div><p class="podium-rank-label">${tier}</p><div class="podium-base"></div></div>`;
        const name = entry.poems?.pen_name || "Unknown";
        return `
          <div class="podium-slot ${tier}">
            <div class="podium-medal">${initial}</div>
            <p class="podium-name">${escapeHtml(name)}</p>
            <p class="podium-prize">${prize}pts · "${escapeHtml(entry.poems?.title || '')}"</p>
            <div class="podium-base">
              <p class="podium-rank-label">${tier}</p>
              ${entry.host_comment ? `<p class="podium-comment">"${escapeHtml(entry.host_comment)}"</p>` : ""}
            </div>
          </div>`;
      }

      let html = `<div class="podium-wrap">
        <div class="podium">
          ${slot(silverEntry, 'silver', c.silver_prize, 'S')}
          ${slot(goldEntry, 'gold', c.gold_prize, 'G')}
          ${slot(bronzeEntry, 'bronze', c.bronze_prize, 'B')}
        </div>`;

      if (specialEntries.length) {
        html += `<div class="special-list">` + specialEntries.map(e => {
          const prize = (c.special_prizes || [])[(e.special_slot_index||1) - 1] || 0;
          return `
            <div class="special-item">
              <span class="medallion special"></span>
              <div>
                <p class="special-item-name">${escapeHtml(e.poems?.pen_name || 'Unknown')} — Special Recognition ${e.special_slot_index || ''}</p>
                <p class="special-item-meta">${prize}pts · "${escapeHtml(e.poems?.title || '')}"${e.host_comment ? ' · "' + escapeHtml(e.host_comment) + '"' : ''}</p>
              </div>
            </div>`;
        }).join("") + `</div>`;
      }

      html += `</div>`;
      return html;
    }

    function renderRegisterBox() {
      const c = contest;
      const showPrewrite = c.entry_type === "open" || c.entry_type === "prewrite_only";
      const showNewWrite = c.entry_type === "open" || c.entry_type === "new_write_only";

      let radios = "";
      if (showPrewrite) radios += `<div class="entry-radio-btn" data-mode="prewrite">Enter an existing poem</div>`;
      if (showNewWrite) radios += `<div class="entry-radio-btn" data-mode="new_write">Write something new</div>`;

      return `
        <div class="register-box">
          <b class="rb-title">Enter This Contest</b>
          <div class="entry-type-radios">${radios}</div>
          <div class="register-panel" id="prewritePanel">
            <label class="field-label">Choose one of your published poems</label>
            <select id="prewriteSelect"><option value="">Loading your poems…</option></select>
            <div style="margin-top:18px;text-align:center;"><button class="btn btn-gold" id="submitPrewriteBtn">Register This Poem</button></div>
          </div>
          <div class="register-panel" id="newWritePanel">
            <label class="field-label">Title</label>
            <input type="text" id="nwTitle" placeholder="Title of your entry…" maxlength="120"/>
            <label class="field-label">Your Poem</label>
            <textarea id="nwContent" placeholder="Write your entry here…"></textarea>
            <div style="margin-top:18px;text-align:center;"><button class="btn btn-gold" id="submitNewWriteBtn">Submit Entry</button></div>
          </div>
        </div>`;
    }

    function renderEntryRow(e, idx) {
      const c = contest;
      const canJudge = isHost() && c.status === "closed_for_judging";
      let awardBadge = "";
      if (e.award === "gold") awardBadge = `<span class="award-badge award-gold">Gold</span>`;
      else if (e.award === "silver") awardBadge = `<span class="award-badge award-silver">Silver</span>`;
      else if (e.award === "bronze") awardBadge = `<span class="award-badge award-bronze">Bronze</span>`;
      else if (e.award === "special") awardBadge = `<span class="award-badge award-special">Special ${e.special_slot_index || ''}</span>`;

      return `
        <div class="entry-row ${e.award ? 'awarded' : ''}">
          <div class="entry-number">${String(idx+1).padStart(2,'0')}</div>
          <div>
            <div class="entry-top">
              <div>
                <p class="entry-title">${escapeHtml(e.poems?.title || "Untitled")}</p>
                <p class="entry-author">by ${escapeHtml(e.poems?.pen_name || "Unknown")}</p>
              </div>
              ${awardBadge}
            </div>
            <p class="entry-excerpt">${escapeHtml(excerpt(e.poems?.content))}</p>
            <div class="entry-meta-row">
              <a class="entry-link" href="poem.html?id=${e.poem_id}">Read full poem & comment →</a>
            </div>
            ${e.host_comment && !canJudge ? `<p class="host-comment">"${escapeHtml(e.host_comment)}" — host</p>` : ""}
            ${canJudge ? `
              <div class="judge-select-row">
                <select class="judge-award-select" data-entry-id="${e.id}">
                  <option value="">No award</option>
                  ${c.gold_prize > 0 ? `<option value="gold">Gold</option>` : ""}
                  ${c.silver_prize > 0 ? `<option value="silver">Silver</option>` : ""}
                  ${c.bronze_prize > 0 ? `<option value="bronze">Bronze</option>` : ""}
                  ${(c.special_prizes||[]).map((p,i) => `<option value="special:${i+1}">Special ${i+1}</option>`).join("")}
                </select>
                <input type="text" class="judge-comment-input" data-entry-id="${e.id}" placeholder="Comment for this winner (optional)" style="flex:1;min-width:160px;"/>
              </div>` : ""}
          </div>
        </div>`;
    }

    function renderJudgePanel() {
      return `
        <div class="judge-panel">
          <h3>Render Your Verdict</h3>
          <p class="sub">Select an award for each entry above, then confirm. Points and trophies distribute immediately and cannot be undone.</p>
          <button class="btn btn-gold" id="confirmJudgingBtn">Confirm Winners & Distribute Prizes</button>
        </div>`;
    }

    function wireUpEvents() {
      document.querySelectorAll(".entry-radio-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".entry-radio-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          selectedEntryMode = btn.dataset.mode;
          document.getElementById("prewritePanel")?.classList.toggle("active", selectedEntryMode === "prewrite");
          document.getElementById("newWritePanel")?.classList.toggle("active", selectedEntryMode === "new_write");
          if (selectedEntryMode === "prewrite") loadMyPoemsForSelect();
        });
      });

      document.getElementById("submitPrewriteBtn")?.addEventListener("click", registerPrewrite);
      document.getElementById("submitNewWriteBtn")?.addEventListener("click", registerNewWrite);
      document.getElementById("closeContestBtn")?.addEventListener("click", closeContest);
      document.getElementById("confirmJudgingBtn")?.addEventListener("click", confirmJudging);
    }

    async function loadMyPoemsForSelect() {
      const { data, error } = await client
        .from("poems")
        .select("id, title")
        .eq("user_id", currentUser.id)
        .eq("status", "published")
        .order("created_at", { ascending: false });

      const sel = document.getElementById("prewriteSelect");
      if (error || !data || !data.length) {
        sel.innerHTML = `<option value="">You have no published poems yet</option>`;
        return;
      }
      sel.innerHTML = `<option value="">Select a poem…</option>` +
        data.map(p => `<option value="${p.id}">${escapeHtml(p.title || 'Untitled')}</option>`).join("");
    }

    async function registerPrewrite() {
      const poemId = document.getElementById("prewriteSelect").value;
      if (!poemId) { toast("Choose a poem first."); return; }

      const btn = document.getElementById("submitPrewriteBtn");
      btn.disabled = true; btn.textContent = "Registering…";

      const { error } = await client.from("contest_entries").insert([{
        contest_id: contestId, poem_id: poemId, entrant_id: currentUser.id
      }]);

      btn.disabled = false; btn.textContent = "Register This Poem";

      if (error) { toast("Couldn't register: " + error.message); return; }
      toast("Entered! Good luck.");
      loadContest();
    }

    async function registerNewWrite() {
      const title = document.getElementById("nwTitle").value.trim();
      const content = document.getElementById("nwContent").value.trim();
      if (!title) { toast("Give your entry a title."); return; }
      if (!content) { toast("Your poem is empty."); return; }

      const btn = document.getElementById("submitNewWriteBtn");
      btn.disabled = true; btn.textContent = "Submitting…";

      const { data: poemData, error: poemError } = await client.from("poems").insert([{
        user_id: currentUser.id,
        pen_name: myProfile.pen_name || "Anonymous",
        title, content,
        status: "published"
      }]).select().single();

      if (poemError) {
        btn.disabled = false; btn.textContent = "Submit Entry";
        toast("Couldn't save your poem: " + poemError.message);
        return;
      }

      const { error: entryError } = await client.from("contest_entries").insert([{
        contest_id: contestId, poem_id: poemData.id, entrant_id: currentUser.id
      }]);

      btn.disabled = false; btn.textContent = "Submit Entry";

      if (entryError) { toast("Poem saved but entry failed: " + entryError.message); return; }
      toast("Entered! Good luck.");
      loadContest();
    }

    async function closeContest() {
      if (!confirm("Close entries for this contest? Nobody will be able to register after this.")) return;
      const { error } = await client.rpc("host_close_contest", { p_contest_id: contestId });
      if (error) { toast("Couldn't close: " + error.message); return; }
      toast("Entries closed. Time to render your verdict.");
      loadContest();
    }

    async function confirmJudging() {
      const selects = document.querySelectorAll(".judge-award-select");
      const awards = [];
      let totalAwarded = 0;

      selects.forEach(sel => {
        const val = sel.value;
        if (!val) return;
        const entryId = parseInt(sel.dataset.entryId);
        const commentInput = document.querySelector(`.judge-comment-input[data-entry-id="${entryId}"]`);
        const comment = commentInput ? commentInput.value.trim() : "";

        if (val.startsWith("special:")) {
          awards.push({ entry_id: entryId, award: "special", special_slot_index: parseInt(val.split(":")[1]), comment });
        } else {
          awards.push({ entry_id: entryId, award: val, comment });
        }
        totalAwarded++;
      });

      if (!totalAwarded) { toast("Select at least one award before confirming."); return; }
      if (!confirm(`Confirm ${totalAwarded} winner(s)? Points and trophies distribute immediately and this can't be undone.`)) return;

      const btn = document.getElementById("confirmJudgingBtn");
      btn.disabled = true; btn.textContent = "Distributing prizes…";

      const { error } = await client.rpc("host_judge_contest", {
        p_contest_id: contestId,
        p_awards: awards
      });

      btn.disabled = false; btn.textContent = "Confirm Winners & Distribute Prizes";

      if (error) { toast("Judging failed: " + error.message); return; }
      toast("Winners announced! Prizes distributed.");
      loadContest();
    }
  </script>
</body>
</html>

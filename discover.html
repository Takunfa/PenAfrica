<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discover — Pen Africa</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#07050b;--bg2:#0f0a1a;--bg3:#160d26;
      --purple:#7C3AED;--violet:#A78BFA;
      --rule:rgba(167,139,250,0.15);
      --text:#EDE8F5;--muted:#9585B8;--gold:#f59e0b;
      --serif:'Cormorant Garamond',serif;--sans:'Inter',system-ui,sans-serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
    a{text-decoration:none;color:inherit;}

    .header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 52px;height:68px;border-bottom:1px solid var(--rule);background:rgba(7,5,11,0.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;}
    .pen-name{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--violet);}
    .header-brand{text-align:center;font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);}
    .header-icons{justify-self:end;display:flex;gap:22px;font-size:1.1rem;align-items:center;}
    .header-icons a{opacity:0.55;transition:opacity .2s,transform .2s;}
    .header-icons a:hover{opacity:1;transform:scale(1.15);}

    .notif-wrap{position:relative;}
    .notif-bell-btn{background:none;border:none;font-size:1.1rem;cursor:pointer;opacity:0.55;transition:opacity .2s,transform .2s;position:relative;padding:0;line-height:1;color:inherit;font-family:inherit;}
    .notif-bell-btn:hover{opacity:1;transform:scale(1.15);}
    .notif-badge{position:absolute;top:-6px;right:-8px;background:#dc2626;color:#fff;font-size:0.6rem;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:'Inter',sans-serif;}
    .notif-dropdown{display:none;position:absolute;top:calc(100% + 14px);right:0;width:340px;max-width:90vw;max-height:480px;background:var(--bg2);border:1px solid var(--rule);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,0.5);overflow:hidden;flex-direction:column;z-index:200;}
    .notif-dropdown.open{display:flex;}
    .notif-dropdown-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule);font-family:'Inter',sans-serif;font-weight:600;font-size:0.85rem;color:var(--text);}
    .notif-mark-all{background:none;border:none;color:var(--violet);font-size:0.72rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
    .notif-mark-all:hover{text-decoration:underline;}
    .notif-list{overflow-y:auto;flex:1;}
    .notif-item{display:block;padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s;text-align:left;}
    .notif-item:hover{background:var(--bg3);}
    .notif-item.unread{background:rgba(167,139,250,0.06);}
    .notif-item.unread::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--violet);margin-right:6px;vertical-align:middle;}
    .notif-title{font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:600;color:var(--text);margin-bottom:3px;}
    .notif-body{font-family:'Inter',sans-serif;font-size:0.76rem;color:var(--muted);line-height:1.4;}
    .notif-time{font-family:'Inter',sans-serif;font-size:0.65rem;color:var(--violet);margin-top:5px;}
    .notif-empty,.notif-loading{padding:40px 20px;text-align:center;color:var(--muted);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.95rem;}
    @media(max-width:640px){.notif-dropdown{position:fixed;top:68px;right:10px;left:10px;width:auto;max-width:none;}}
    .header-icons a{opacity:0.55;transition:opacity .2s,transform .2s;}
    .header-icons a:hover{opacity:1;transform:scale(1.15);}

    .search-hero{padding:56px 32px 36px;text-align:center;max-width:680px;margin:0 auto;}
    .search-eyebrow{font-size:0.65rem;letter-spacing:0.24em;text-transform:uppercase;color:var(--violet);margin-bottom:14px;font-weight:600;}
    .search-title{font-family:var(--serif);font-style:italic;font-size:2.2rem;margin-bottom:24px;}
    .search-box-wrap{position:relative;}
    .search-input{
      width:100%;padding:16px 50px 16px 22px;border-radius:30px;
      background:var(--bg2);border:1px solid var(--rule);
      font-family:var(--sans);font-size:0.95rem;color:var(--text);
    }
    .search-input:focus{outline:none;border-color:var(--purple);}
    .search-input::placeholder{color:var(--muted);}
    .search-icon-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--purple);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
    .clear-search{position:absolute;right:52px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;display:none;}

    .content{max-width:920px;margin:0 auto;padding:20px 32px 90px;}

    .result-tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:28px;display:none;}
    .result-tabs.active{display:flex;}
    .rtab{padding:10px 4px;margin-right:28px;font-size:0.78rem;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
    .rtab.rtab-active{color:var(--text);border-bottom-color:var(--purple);}

    .feed-label{font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:20px;}

    /* User result cards */
    .user-result{display:flex;align-items:center;gap:14px;padding:16px;border-radius:10px;background:var(--bg2);border:1px solid var(--rule);margin-bottom:10px;cursor:pointer;transition:border-color .2s;}
    .user-result:hover{border-color:rgba(167,139,250,0.4);}
    .ur-avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--violet);font-size:1.1rem;border:1px solid var(--rule);}
    .ur-avatar img{width:100%;height:100%;object-fit:cover;}
    .ur-name{font-weight:600;font-size:0.95rem;}
    .ur-meta{font-size:0.76rem;color:var(--muted);}

    /* Poem feed cards */
    .poem-feed-card{padding:22px;border-radius:10px;background:var(--bg2);border:1px solid var(--rule);margin-bottom:14px;cursor:pointer;transition:border-color .2s,transform .2s;}
    .poem-feed-card:hover{border-color:rgba(167,139,250,0.4);transform:translateY(-2px);}
    .pfc-title{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin-bottom:6px;}
    .pfc-author{font-size:0.78rem;color:var(--violet);margin-bottom:10px;}
    .pfc-excerpt{font-family:var(--serif);font-style:italic;font-size:0.92rem;color:var(--muted);line-height:1.7;}

    .empty-state{text-align:center;padding:70px 20px;}
    .empty-state .icon{font-size:2.2rem;margin-bottom:14px;}
    .empty-state p{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--muted);}
    .loading-state{text-align:center;padding:70px 20px;color:var(--muted);font-size:0.88rem;}
  </style>
</head>
<body>

  <header class="header">
    <a href="profile.html" class="pen-name" id="userPenName">…</a>
    <p class="header-brand">Discover</p>
    <nav class="header-icons">
      <a href="founder.html" title="Founder Dashboard" id="founderLink" style="display:none;">👑</a>
      <div class="notif-wrap" id="notifWrap">
        <button class="notif-bell-btn" id="notifBellBtn" title="Notifications">
          🔔
          <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-dropdown-header">
            <span>Notifications</span>
            <button class="notif-mark-all" id="notifMarkAllBtn">Mark all read</button>
          </div>
          <div class="notif-list" id="notifList">
            <div class="notif-loading">Loading…</div>
          </div>
        </div>
      </div>
      <a href="messages.html"      title="Messages">✉️</a>
      <a href="settings.html"      title="Settings">⚙️</a>
      <a href="profile.html"       title="Profile">👤</a>
    </nav>
  </header>

  <section class="search-hero">
    <p class="search-eyebrow">Find Poets & Poems</p>
    <h1 class="search-title">Discover</h1>
    <div class="search-box-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="Search by poet name, poem title, or a line…"/>
      <button class="clear-search" id="clearSearchBtn">✕</button>
      <button class="search-icon-btn" id="searchBtn">🔍</button>
    </div>
  </section>

  <div class="content">
    <div class="result-tabs" id="resultTabs">
      <button class="rtab rtab-active" data-tab="poems">Poems</button>
      <button class="rtab" data-tab="users">Poets</button>
    </div>

    <p class="feed-label" id="feedLabel">Wandering the archive — a few verses, chosen at random</p>

    <div id="resultsArea">
      <div class="loading-state">Loading…</div>
    </div>
  </div>

  <script>
    const SUPA_URL = "https://nefqvdfhkeovwuneeozg.supabase.co";
    const SUPA_KEY = "sb_publishable_JLJ2a-Ks9LznxtOAYrtzEQ_Q6dzGsHh";
    const client   = supabase.createClient(SUPA_URL, SUPA_KEY);

    let currentUser = null;
    let searchMode = false;
    let activeResultTab = "poems";
    let searchPoemResults = [];
    let searchUserResults = [];

    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function excerpt(text, len) {
      const plain = (text || "").replace(/<[^>]*>/g, "");
      return plain.slice(0, len || 140).trim() + (plain.length > (len||140) ? "…" : "");
    }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* ── NOTIFICATIONS ── */
    let notifications = [];

    function timeAgoNotif(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "Just now";
      if (mins < 60) return mins + "m ago";
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + "h ago";
      const days = Math.floor(hours / 24);
      if (days < 7) return days + "d ago";
      return new Date(dateStr).toLocaleDateString();
    }

    async function initNotifications(userId) {
      await loadNotifications(userId);
      wireNotificationEvents(userId);
    }

    async function loadNotifications(userId) {
      const { data, error } = await client
        .from("notifications")
        .select("id, type, title, body, link_url, read, created_at")
        .eq("user_id", userId)
        .order("created_at", { ascending: false })
        .limit(30);

      if (error) {
        console.warn("Notifications load error:", error.message);
        document.getElementById("notifList").innerHTML = `<div class="notif-empty">Couldn't load notifications.</div>`;
        return;
      }

      notifications = data || [];
      renderNotifBadge();
      renderNotifList();
    }

    function renderNotifBadge() {
      const unreadCount = notifications.filter(n => !n.read).length;
      const badge = document.getElementById("notifBadge");
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 9 ? "9+" : unreadCount;
        badge.style.display = "flex";
      } else {
        badge.style.display = "none";
      }
    }

    function renderNotifList() {
      const el = document.getElementById("notifList");
      if (!notifications.length) {
        el.innerHTML = `<div class="notif-empty">You're all caught up.</div>`;
        return;
      }
      el.innerHTML = notifications.map(n => `
        <div class="notif-item ${n.read ? '' : 'unread'}" data-id="${n.id}" data-link="${escapeHtml(n.link_url || '')}">
          <p class="notif-title">${escapeHtml(n.title)}</p>
          ${n.body ? `<p class="notif-body">${escapeHtml(n.body)}</p>` : ''}
          <p class="notif-time">${timeAgoNotif(n.created_at)}</p>
        </div>
      `).join("");

      el.querySelectorAll(".notif-item").forEach(item => {
        item.addEventListener("click", async () => {
          const id = parseInt(item.dataset.id);
          const link = item.dataset.link;
          await markNotifRead(id);
          if (link) window.location.href = link;
        });
      });
    }

    async function markNotifRead(id) {
      const notif = notifications.find(n => n.id === id);
      if (!notif || notif.read) return;
      notif.read = true;
      renderNotifBadge();
      renderNotifList();
      await client.from("notifications").update({ read: true }).eq("id", id);
    }

    async function markAllNotifsRead(userId) {
      const unread = notifications.filter(n => !n.read);
      if (!unread.length) return;
      notifications.forEach(n => n.read = true);
      renderNotifBadge();
      renderNotifList();
      await client.from("notifications").update({ read: true }).eq("user_id", userId).eq("read", false);
    }

    function wireNotificationEvents(userId) {
      const bellBtn = document.getElementById("notifBellBtn");
      const dropdown = document.getElementById("notifDropdown");
      const wrap = document.getElementById("notifWrap");

      bellBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        dropdown.classList.toggle("open");
      });

      document.getElementById("notifMarkAllBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        markAllNotifsRead(userId);
      });

      document.addEventListener("click", (e) => {
        if (!wrap.contains(e.target)) dropdown.classList.remove("open");
      });
    }

    (async () => {
      const { data: sessionData } = await client.auth.getSession();
      currentUser = sessionData?.session?.user ?? null;
      if (!currentUser) { window.location.href = "login.html"; return; }

      const { data: profile } = await client
        .from("profiles")
        .select("pen_name, role")
        .eq("id", currentUser.id)
        .single();

      document.getElementById("userPenName").textContent = profile?.pen_name || "Nameless Voice";
      if (profile?.role === "founder" || profile?.role === "admin") {
        document.getElementById("founderLink").style.display = "inline-flex";
      }

      initNotifications(currentUser.id);
      loadRandomFeed();
    })();

    /* ── Default: random published-poem feed, shuffled once per visit ── */
    async function loadRandomFeed() {
      const { data, error } = await client
        .from("poems")
        .select("id, title, content, pen_name, user_id")
        .eq("status", "published")
        .limit(200); // pull a broad pool, then shuffle client-side

      if (error) {
        document.getElementById("resultsArea").innerHTML =
          `<div class="empty-state"><div class="icon">⚠</div><p>Couldn't load poems: ${escapeHtml(error.message)}</p></div>`;
        return;
      }

      if (!data || !data.length) {
        document.getElementById("resultsArea").innerHTML =
          `<div class="empty-state"><div class="icon">📜</div><p>No published poems yet. Be the first voice.</p></div>`;
        return;
      }

      const shuffled = shuffle(data);
      renderPoemFeed(shuffled);
    }

    function renderPoemFeed(poems) {
      const html = poems.map(p => `
        <div class="poem-feed-card" onclick="window.location.href='poem.html?id=${p.id}'">
          <p class="pfc-title">${escapeHtml(p.title || 'Untitled')}</p>
          <p class="pfc-author">by ${escapeHtml(p.pen_name || 'Unknown')}</p>
          <p class="pfc-excerpt">${escapeHtml(excerpt(p.content))}</p>
        </div>
      `).join("");
      document.getElementById("resultsArea").innerHTML = html;
    }

    function renderUserResults(users) {
      if (!users.length) {
        document.getElementById("resultsArea").innerHTML =
          `<div class="empty-state"><div class="icon">🔍</div><p>No poets found by that name.</p></div>`;
        return;
      }
      const html = users.map(u => {
        const initial = (u.pen_name || "?")[0].toUpperCase();
        const avatar = u.profile_picture ? `<img src="${escapeHtml(u.profile_picture)}" alt=""/>` : initial;
        return `
          <div class="user-result" onclick="window.location.href='profile.html?id=${u.id}'">
            <div class="ur-avatar">${avatar}</div>
            <div>
              <p class="ur-name">${escapeHtml(u.pen_name || "Unnamed")}</p>
              <p class="ur-meta">${u.followers ?? 0} followers</p>
            </div>
          </div>`;
      }).join("");
      document.getElementById("resultsArea").innerHTML = html;
    }

    /* ── Search: both users (pen_name) and poems (title/content) ── */
    async function runSearch(query) {
      query = query.trim();
      if (!query) {
        exitSearchMode();
        return;
      }

      searchMode = true;
      document.getElementById("resultTabs").classList.add("active");
      document.getElementById("clearSearchBtn").style.display = "block";
      document.getElementById("feedLabel").textContent = `Results for "${query}"`;
      document.getElementById("resultsArea").innerHTML = `<div class="loading-state">Searching…</div>`;

      const [poemsRes, usersRes] = await Promise.all([
        client.from("poems")
          .select("id, title, content, pen_name, user_id")
          .eq("status", "published")
          .or(`title.ilike.%${query}%,content.ilike.%${query}%`)
          .limit(60),
        client.from("profiles")
          .select("id, pen_name, profile_picture, followers")
          .ilike("pen_name", `%${query}%`)
          .limit(60)
      ]);

      searchPoemResults = poemsRes.data || [];
      searchUserResults = usersRes.data || [];

      document.querySelectorAll(".rtab").forEach(t => t.classList.remove("rtab-active"));
      document.querySelector(`.rtab[data-tab="${activeResultTab}"]`).classList.add("rtab-active");

      renderActiveTab();
    }

    function renderActiveTab() {
      if (activeResultTab === "poems") {
        renderPoemFeed(searchPoemResults);
        if (!searchPoemResults.length) {
          document.getElementById("resultsArea").innerHTML =
            `<div class="empty-state"><div class="icon">📜</div><p>No poems matched. Try a different search, or check the Poets tab.</p></div>`;
        }
      } else {
        renderUserResults(searchUserResults);
      }
    }

    function exitSearchMode() {
      searchMode = false;
      document.getElementById("resultTabs").classList.remove("active");
      document.getElementById("clearSearchBtn").style.display = "none";
      document.getElementById("feedLabel").textContent = "Wandering the archive — a few verses, chosen at random";
      document.getElementById("searchInput").value = "";
      loadRandomFeed();
    }

    document.querySelectorAll(".rtab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".rtab").forEach(t => t.classList.remove("rtab-active"));
        tab.classList.add("rtab-active");
        activeResultTab = tab.dataset.tab;
        renderActiveTab();
      });
    });

    document.getElementById("searchBtn").addEventListener("click", () => runSearch(document.getElementById("searchInput").value));
    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch(e.target.value);
    });
    document.getElementById("clearSearchBtn").addEventListener("click", exitSearchMode);
  </script>
</body>
</html>
